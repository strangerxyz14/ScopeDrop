<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" width="1536" height="864" role="img" aria-label="ScopeDrop event placeholder">
  <!-- Universal fallback for event covers when no source image resolves.
       Oxford background, parrot accent, ScopeDrop wordmark. Sized 16:9
       so it drops into any hero container without letterboxing. Kept as
       plain SVG so it stays crisp at every render size and requires no
       image-processing dependency in the repo. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2847"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3ECF6E" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#3ECF6E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#1C3352" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1536" height="864" fill="url(#bg)"/>
  <rect width="1536" height="864" fill="url(#grid)" opacity="0.35"/>
  <rect width="1536" height="864" fill="url(#glow)"/>
  <!-- ScopeDrop wordmark, centered -->
  <g transform="translate(768 432)">
    <text
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="72"
      font-weight="700"
      letter-spacing="-2"
      fill="#3ECF6E"
    >ScopeDrop</text>
    <text
      text-anchor="middle"
      dominant-baseline="middle"
      y="60"
      font-family="'IBM Plex Mono', ui-monospace, monospace"
      font-size="14"
      letter-spacing="8"
      fill="#7C93AC"
    >EVENT COVER · UNRESOLVED</text>
  </g>
</svg>
